```
<main class="terminal">
    <header class="terminal-bar">
        <div class="traffic-lights">
            <span class="light red"></span>
            <span class="light yellow"></span>
            <span class="light green"></span>
        </div>

        <div class="terminal-title">terminal — WhyShallow@localhost</div>

        <div class="terminal-actions">
            <button id="minimizeBtn" aria-label="Minimize">−</button>
            <button id="maximizeBtn" aria-label="Maximize">□</button>
            <button id="closeBtn" aria-label="Close">×</button>
        </div>
    </header>

    <section class="terminal-body">
        <div id="bootScreen" class="boot-screen">
            <div id="bootText"></div>
        </div>

        <div id="terminalContent" class="terminal-content hidden">
            <div id="output" class="output"></div>

            <div class="input-row">
                <span class="prompt">
                    <span class="prompt-user">WhyShallow</span><span class="prompt-at">@</span><span class="prompt-host">localhost</span><span class="prompt-symbol">:~$</span>
                </span>
                <input id="commandInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command">
            </div>
        </div>
    </section>

    <footer class="status-bar">
        <span id="statusText">READY</span>
        <span>UTF-8</span>
        <span>CLI MODE</span>
    </footer>
</main>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
