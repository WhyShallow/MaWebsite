<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpooderVenom | projects</title>
  <meta name="description" content="SpooderVenom's projects, tools, Minecraft work, and experiments." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="window" aria-label="Windows CLI portfolio">
    <header class="titlebar">
      <div class="app-title"><span class="app-icon">&gt;_</span> C:\\Users\\SpooderVenom\\projects</div>
      <div class="window-controls" aria-hidden="true"><span>—</span><span>□</span><span>×</span></div>

    <section class="terminal" id="terminal" tabindex="0">
      <div class="terminal-output" id="output" aria-live="polite"></div>

        <span class="prompt">C:\\Users\\SpooderVenom&gt;</span>
        <input id="commandInput" class="command-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command" />
      </div>
    </section>

    <footer class="statusbar">
      <span>ONLINE</span><span id="clock">00:00:00</span><span>UTF-8</span><span>STATIC</span>
    </footer>
  </main>

  <script src="script.js"></script>
